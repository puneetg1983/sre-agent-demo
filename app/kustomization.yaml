apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - identities.yaml
  - services.yaml
  - deployments.yaml
  - ingress.yaml
  - sql.yaml
configMapGenerator:
  - name: pricing-config
    namespace: store
    envs:
      - pricing.env
  - name: frontend-nginx
    namespace: store
    files:
      - default.conf=frontend.conf
labels:
  - pairs:
      demo: sreagent
    includeTemplates: true
patches:
  - target:
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ignored
      spec:
        template:
          metadata:
            labels:
              azure.workload.identity/use: "true"
          spec:
            nodeSelector:
              kubernetes.azure.com/agentpool: user
            terminationGracePeriodSeconds: 30
