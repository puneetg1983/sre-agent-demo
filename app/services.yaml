apiVersion: v1
kind: Service
metadata: {name: store-front, namespace: store}
spec:
  selector: {app: store-front}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: v1
kind: Service
metadata: {name: store-admin, namespace: store}
spec:
  selector: {app: store-admin}
  ports: [{name: http, port: 80, targetPort: 8081}]
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: store}
spec:
  selector: {app: order-service}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata: {name: product-service, namespace: store}
spec:
  selector: {app: product-service}
  ports: [{name: http, port: 3002, targetPort: 3002}]
---
apiVersion: v1
kind: Service
metadata: {name: makeline-service, namespace: store}
spec:
  selector: {app: makeline-service}
  ports: [{name: http, port: 3001, targetPort: 3001}]
---
apiVersion: v1
kind: Service
metadata: {name: checkout-api, namespace: store}
spec:
  selector: {app: checkout-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
