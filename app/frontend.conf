server {
    listen 8080;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    location /api/orders {
        rewrite ^/api/orders$ / break;
        rewrite ^/api/orders(/.*)$ $1 break;
        proxy_pass http://checkout-api:8080;
        proxy_http_version 1.1;
    }
    location /api/products {
        rewrite ^/api/products$ / break;
        rewrite ^/api/products(/.*)$ $1 break;
        proxy_pass http://product-service:3002;
        proxy_http_version 1.1;
    }
    location /api/pickup/ {
        rewrite ^/api/pickup(/.*)$ /pickup$1 break;
        proxy_pass http://inventory-service:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 25s;
    }
}
